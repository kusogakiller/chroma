[workspace]
resolver = "3"
members = [
    "crates/chroma-core",
    "crates/chroma-crypto",
    "crates/chroma-state",
    "crates/chroma-tx",
    "crates/chroma-block",
    "crates/chroma-consensus",
    "crates/chroma-storage",
    "crates/chroma-p2p",
    "crates/chroma-wallet",
    "crates/chroma-cli",
    "crates/chroma-rpc",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chroma/chroma"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Vendored canonical RandomX (BSD-3-Clause, exact crates.io 1.6.0 bytes):
# the registry-extracted copy proved unreliable in this environment, and
# vendoring pins the consensus-critical C++ sources in-tree for audit.
[patch.crates-io]
randomx-rs = { path = "vendor/randomx-rs" }