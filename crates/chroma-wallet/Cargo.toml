[package]
name = "chroma-wallet"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Chroma wallet: key management, signing"

[dependencies]
chroma-core = { path = "../chroma-core" }
chroma-crypto = { path = "../chroma-crypto" }
chroma-tx = { path = "../chroma-tx" }
chroma-state = { path = "../chroma-state" }
blake3 = "1.5"
zeroize = "1.7"
rpassword = "7"
hex = "0.4"
getrandom = "0.2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "macros"] }
subtle = "2"

[dev-dependencies]
proptest = "1.5"